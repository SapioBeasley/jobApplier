name: Refresh cleanup lockfile

on:
  push:
    branches:
      - issue-27-cleanup-legacy-ui-automation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile and remove this temporary workflow
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-lock.yml
          git add package-lock.json
          git commit -m "chore: refresh lockfile after runtime cleanup"
          git push
