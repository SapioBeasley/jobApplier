name: Built In smoke

on:
  push:
    branches:
      - issue-3-builtin-adapter
    paths:
      - .github/workflows/builtin-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch and parse one live Built In page
        run: |
          npx tsx -e '
            import { collectBuiltInJobs } from "./src/sources/builtin/fetch";
            (async () => {
              const jobs = await collectBuiltInJobs({ positions: ["project manager"], maxPages: 1 });
              if (jobs.length === 0) throw new Error("Built In smoke returned zero parsed jobs");
              console.log(JSON.stringify({ count: jobs.length, sample: jobs.slice(0, 3).map((job) => ({ id: job.sourceJobId, title: job.title, company: job.company, location: job.location, remoteType: job.remoteType, remoteUsEligible: job.remoteUsEligible, quickApply: job.quickApply })) }, null, 2));
            })().catch((error) => { console.error(error); process.exit(1); });
          '
