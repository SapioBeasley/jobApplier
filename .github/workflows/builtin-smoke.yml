name: Built In smoke

on:
  push:
    branches:
      - issue-3-builtin-adapter
    paths:
      - .github/workflows/builtin-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Diagnose one live Built In page
        run: |
          npx tsx -e '
            import { buildBuiltInSearchUrl, fetchBuiltInPage } from "./src/sources/builtin/fetch";
            import { parseBuiltInListPage } from "./src/sources/builtin/parser";
            (async () => {
              const url = buildBuiltInSearchUrl("project manager", 1);
              const html = await fetchBuiltInPage(url);
              const jobs = parseBuiltInListPage(html);
              const itemAt = html.indexOf("ItemList");
              const jobCardAt = html.indexOf("job-card-title");
              const builtinIdAt = html.indexOf("data-builtin-track-job-id");
              const projectAt = html.toLowerCase().indexOf("project manager");
              const snippet = (at) => at >= 0 ? html.slice(Math.max(0, at - 180), at + 420).replaceAll("\n", " ").replaceAll("\r", " ").replaceAll("\t", " ") : null;
              console.log(JSON.stringify({
                url,
                htmlLength: html.length,
                parsedCount: jobs.length,
                markers: {
                  itemList: itemAt >= 0,
                  ldJsonCount: html.split("application/ld+json").length - 1,
                  jobCardTitle: jobCardAt >= 0,
                  builtinTrackJobId: builtinIdAt >= 0,
                  projectManagerText: projectAt >= 0
                },
                itemListSnippet: snippet(itemAt),
                jobCardSnippet: snippet(jobCardAt),
                projectSnippet: snippet(projectAt)
              }, null, 2));
              if (jobs.length === 0) throw new Error("Built In smoke returned zero parsed jobs");
            })().catch((error) => { console.error(error); process.exit(1); });
          '
